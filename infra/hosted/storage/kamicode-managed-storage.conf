[Service]
# systemd creates /var/cache/kamicode with the service account's ownership.
# Keeping disposable provider data outside T3CODE_HOME prevents every rollback
# snapshot from copying it.
CacheDirectory=kamicode
CacheDirectoryMode=0700
Environment=T3CODE_MANAGED_SCRATCH_DIR=/var/cache/kamicode/scratch
Environment=T3CODE_MANAGED_PACKAGE_CACHE_DIR=/var/cache/kamicode/packages
