name: Recover stable release assets

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  recover:
    name: Recover and verify v0.1.10 assets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: camie-ace/KamiCode
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/lib
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify original build checks and draft target
        run: |
          python3 - <<'PYCODE'
          import json, subprocess
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/camie-ace/KamiCode/' + endpoint]))
          source = '3be63f2dc07a090265609ac38a1b83b9881d32e2'
          release = api('releases/405970313')
          assert release['draft'] and not release['prerelease']
          assert release['tag_name'] == 'v0.1.10' and release['target_commitish'] == source
          assert api('git/ref/tags/v0.1.10')['object']['sha'] == source
          jobs = api('actions/runs/37650501063/jobs?filter=latest&per_page=100')['jobs']
          required = ['Preflight', 'Build JS bundle', 'Release quality checks', 'Release tests',
                      'Release web tests', 'Release server tests 1', 'Release server tests 2',
                      'Release server tests 3']
          required += [j['name'] for j in jobs if j['name'].startswith('Desktop ')]
          assert len(required) == 14
          for name in required:
              assert any(j['name'] == name and j['conclusion'] == 'success' for j in jobs), name
          print('All quality checks and six platform builds passed; stable tag and draft match.')
          PYCODE
      - name: Recover and checksum original build artifacts
        run: |
          python3 - <<'PYCODE'
          import concurrent.futures, hashlib, json, pathlib, subprocess, zipfile
          base = 'repos/camie-ace/KamiCode/'
          data = json.loads(subprocess.check_output(['gh','api',base+'actions/runs/37650501063/artifacts?per_page=100']))
          artifacts = [a for a in data['artifacts'] if a['name'].startswith(('cli-', 'desktop-'))]
          assert len(artifacts) == 11 and len({a['name'] for a in artifacts}) == 11
          assert all(not a['expired'] and a['digest'].startswith('sha256:') for a in artifacts)
          root = pathlib.Path('artifact-zips'); root.mkdir()
          target = pathlib.Path('release-assets'); target.mkdir()
          def download(a):
              archive = root / (a['name'] + '.zip')
              with archive.open('wb') as out:
                  subprocess.run(['gh','api',base+'actions/artifacts/'+str(a['id'])+'/zip'],stdout=out,check=True,timeout=600)
              with archive.open('rb') as f:
                  assert 'sha256:'+hashlib.file_digest(f,'sha256').hexdigest() == a['digest'], a['name']
              print('Verified build artifact:', a['name'], flush=True)
              return archive
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              archives = list(pool.map(download, artifacts))
          for archive in archives:
              with zipfile.ZipFile(archive) as z:
                  for info in z.infolist():
                      p = pathlib.Path(info.filename)
                      assert len(p.parts) == 1 and not p.is_absolute()
                  z.extractall(target)
          pathlib.Path('recovery-artifacts.json').write_text(json.dumps(artifacts,indent=2))
          PYCODE
      - name: Merge updater manifests and verify release bytes
        run: |
          node --input-type=module <<'JSCODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import {parseUpdateManifest, mergeUpdateManifests, serializeUpdateManifest} from './scripts/lib/update-manifest.ts';
          const dir = 'release-assets/';
          for (const [platform, primary, secondary, out] of [
            ['mac', 'latest-mac.yml', 'latest-mac-x64.yml', 'latest-mac.yml'],
            ['win', 'latest-win-x64.yml', 'latest-win-arm64.yml', 'latest.yml'],
          ]) {
            const a = parseUpdateManifest(fs.readFileSync(dir + primary, 'utf8'), primary, platform);
            const b = parseUpdateManifest(fs.readFileSync(dir + secondary, 'utf8'), secondary, platform);
            fs.writeFileSync(dir + out, serializeUpdateManifest(mergeUpdateManifests(a, b, platform), { platformLabel: platform }));
            for (const file of [primary, secondary]) if (file !== out) fs.unlinkSync(dir + file);
          }
          const files = fs.readdirSync(dir).sort();
          const cli = files.filter(n => n.startsWith('t3-0.1.10-') && /\.(tar\.gz|zip)$/.test(n));
          assert.equal(cli.length, 5);
          const inventory = [];
          const sha512 = new Map();
          for (const name of files) {
            const h256 = crypto.createHash('sha256'); const h512 = crypto.createHash('sha512');
            for await (const chunk of fs.createReadStream(dir + name)) {h256.update(chunk); h512.update(chunk);}
            inventory.push({name, size:fs.statSync(dir + name).size, sha256:h256.digest('hex')});
            sha512.set(name, h512.digest('base64'));
          }
          for (const name of ['latest.yml', 'latest-mac.yml', 'latest-linux.yml', 'latest-linux-arm64.yml']) {
            const raw = fs.readFileSync(dir + name,'utf8');
            // Linux AppImages add an embedded blockmap size; preserve the published manifest.
            const commonFields = raw.replace(/^    blockMapSize: \d+\r?\n/gm, '');
            const m = parseUpdateManifest(commonFields,name,'release');
            assert.equal(m.version,'0.1.10');
            for (const entry of m.files) {
              assert(files.includes(entry.url),entry.url);
              assert.equal(entry.size, fs.statSync(dir + entry.url).size);
              assert.equal(entry.sha512, sha512.get(entry.url));
            }
            if (name === 'latest.yml' || name === 'latest-mac.yml') {
              assert(m.files.some(f=>f.url.includes('arm64')));
              assert(m.files.some(f=>f.url.includes('x64')));
            }
          }
          for (const name of files.filter(n=>/\.(exe|dmg)$/.test(n) || (n.startsWith('KamiCode-') && n.endsWith('.zip')))) {
            assert(files.includes(name + '.blockmap'),name);
          }
          fs.writeFileSync(dir+'SHA256SUMS',cli.map(name=>inventory.find(f=>f.name===name).sha256+'  '+name).join('\n')+'\n');
          const checksums=fs.readFileSync(dir+'SHA256SUMS');
          inventory.push({name:'SHA256SUMS',size:checksums.length,sha256:crypto.createHash('sha256').update(checksums).digest('hex')});
          assert.equal(inventory.length,27);
          assert(!files.some(n=>n.includes('nightly')||n.includes('preview')));
          fs.writeFileSync('release-inventory.json',JSON.stringify(inventory,null,2)+'\n');
          console.log('Verified all 27 release assets, CLI checksums, updater SHA512 hashes, sizes, architectures, and blockmaps.');
          JSCODE
      - name: Smoke-test isolated Linux CLI
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, socket, subprocess, tarfile, tempfile, time, urllib.request
          with tempfile.TemporaryDirectory(prefix='kc-stable-smoke-') as temp:
              root=pathlib.Path(temp)
              with tarfile.open('release-assets/t3-0.1.10-linux-x64.tar.gz') as archive:
                  archive.extractall(root,filter='data')
              binary=root/'t3-0.1.10-linux-x64'/'t3'
              env={'PATH':'','T3CODE_HOME':str(root/'state'),'TMPDIR':str(root)}
              version=subprocess.check_output([str(binary),'--version'],env=env,text=True,timeout=30).strip()
              assert version == 't3 v0.1.10', version
              with socket.socket() as s:
                  s.bind(('127.0.0.1',0)); port=s.getsockname()[1]
              with (root/'server.log').open('wb') as log:
                  child=subprocess.Popen([str(binary),'serve','--host','127.0.0.1','--port',str(port),'--no-browser'],env=env,cwd=root,stdout=log,stderr=log)
                  try:
                      deadline=time.monotonic()+30
                      while True:
                          assert child.poll() is None, 'Server exited before ready'
                          try:
                              with urllib.request.urlopen('http://127.0.0.1:'+str(port)+'/',timeout=2) as response:
                                  assert response.status == 200
                                  assert b'<html' in response.read().lower()
                              break
                          except (OSError,TimeoutError):
                              if time.monotonic()>deadline: raise
                              time.sleep(0.25)
                  finally:
                      child.terminate()
                      try: child.wait(timeout=10)
                      except subprocess.TimeoutExpired: child.kill(); child.wait()
              print(version + ': isolated server served the web client with HTTP 200; smoke process stopped.')
          PYCODE
      - name: Upload verified assets to existing draft
        run: |
          python3 - <<'PYCODE'
          import json, pathlib, subprocess, time, urllib.parse
          base='repos/camie-ace/KamiCode/releases/405970313'
          expected=json.loads(pathlib.Path('release-inventory.json').read_text())
          def current():
              return {a['name']:a for a in json.loads(subprocess.check_output(['gh','api',base+'/assets?per_page=100']))}
          existing=current()
          for item in sorted(expected,key=lambda i:i['size']):
              name=item['name']
              for attempt in range(3):
                  if name in existing:
                      asset=existing[name]
                      assert asset['state']=='uploaded' and asset['size']==item['size'],name
                      assert asset['digest']=='sha256:'+item['sha256'],name
                      break
                  url='https://uploads.github.com/'+base+'/assets?name='+urllib.parse.quote(name)
                  result=subprocess.run(['gh','api','--method','POST',url,'-H','Content-Type: application/octet-stream','--input','release-assets/'+name],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=300)
                  existing=current()
                  if name in existing:
                      asset=existing[name]
                      assert asset['state']=='uploaded' and asset['size']==item['size'],name
                      assert asset['digest']=='sha256:'+item['sha256'],name
                      break
                  if result.returncode != 0:
                      print('Upload retry:',name,'attempt',attempt+1,flush=True)
                      time.sleep(3)
              else: raise RuntimeError('Could not verify uploaded asset '+name)
              print('Uploaded and verified:',name,flush=True)
          assert set(existing)=={i['name'] for i in expected}
          print('All 27 release assets uploaded and matched GitHub SHA256 digests. Draft remains unpublished.')
          PYCODE
      - name: Preserve recovery verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stable-release-recovery-evidence
          path: |
            recovery-artifacts.json
            release-inventory.json
            release-assets/SHA256SUMS
            release-assets/latest*.yml
          if-no-files-found: warn
